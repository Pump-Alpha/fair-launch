[package]
name = "vow"
version = "0.1.0"
description = "Fair-launch vows: a creator locks part of their token's supply until a date they choose"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "=0.18.2"
litesvm-token = { version = "=0.18.2", features = ["token-2022"] }
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "3"
solana-clock = "3"
